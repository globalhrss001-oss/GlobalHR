<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="../assets/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="../assets/favicon.ico" sizes="any" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="../assets/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <meta name="view-transition" content="same-origin" />
    <title>Admin Login | Global HR</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brandBlue: "#1a56db",
              brandNavy: "#1e3a8a",
              brandPurple: "#4338ca",
              brandDark: "#0f172a",
              brandLight: "#f8fafc",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/style.css" />
    <script>try{var h=document.documentElement,t=localStorage.getItem("globalhr_theme");if(t==="dark")h.classList.add("dark");else h.classList.remove("dark");}catch(e){}</script>
  </head>
  <body class="min-h-screen bg-brandLight text-brandDark dark:bg-slate-950 flex flex-col">
    <header class="border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
      <div class="mx-auto max-w-lg px-4 py-4 flex items-center justify-between">
        <a href="../index.html" class="flex items-center gap-2">
          <img src="../assets/logo.png" alt="Global HR" class="site-logo site-logo--compact dark:opacity-95" width="180" height="56" decoding="async" />
        </a>
        <div class="flex items-center gap-2"><button id="themeToggle" type="button" class="rounded-md border border-slate-300 dark:border-slate-600 px-2.5 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:border-brandBlue hover:text-brandBlue dark:hover:text-sky-400 transition-colors" aria-label="Toggle color theme">
          <span class="inline dark:hidden">Dark</span>
          <span class="hidden dark:inline">Light</span>
        </button>
        </div>
      </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12 text-brandDark dark:text-slate-200">
      <div class="w-full max-w-md rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-8 shadow-sm">
        <h1 class="text-xl font-bold tracking-tight text-brandNavy dark:text-slate-100">
          Staff login
        </h1>
        <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
          Sign in to manage job listings.
        </p>

        <form id="adminLoginForm" class="mt-6 space-y-4">
          <div>
            <label for="loginUsername" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
              Username
            </label>
            <input
              id="loginUsername"
              name="username"
              type="text"
              autocomplete="username"
              required
              class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"
            />
          </div>
          <div>
            <label for="loginPassword" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
              Password
            </label>
            <div class="relative">
              <input
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 pl-3 pr-10 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"
              />
              <button
                id="loginPasswordToggle"
                type="button"
                class="absolute inset-y-0 right-0 flex items-center justify-center w-10 text-slate-500 hover:text-brandBlue dark:text-slate-400 dark:hover:text-sky-400 transition-colors rounded-r-md"
                aria-label="Show password"
                aria-pressed="false"
                title="Show password"
              >
                <svg id="loginPasswordEyeShow" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <svg id="loginPasswordEyeHide" class="hidden h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>
          <p id="loginError" class="hidden text-sm text-red-700 dark:text-red-200 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 rounded-md px-3 py-2" role="alert"></p>
          <button type="submit" class="w-full rounded-md bg-brandBlue px-4 py-2.5 text-sm font-semibold text-white hover:bg-brandNavy transition-colors">
            Sign in
          </button>
        </form>
        <p class="mt-6 text-center text-xs text-slate-500">
          <a href="../index.html" class="font-medium text-brandBlue hover:text-brandNavy dark:hover:text-sky-300 transition-colors">Back to website</a>
        </p>
      </div>
    </main>

    <script src="../js/cms-config.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
