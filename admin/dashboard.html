<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/favicon.ico" sizes="any" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <meta name="view-transition" content="same-origin" />
    <title>Job CMS | Global HR Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brandBlue: "#1a56db",
              brandNavy: "#1e3a8a",
              brandPurple: "#4338ca",
              brandDark: "#0f172a",
              brandLight: "#f8fafc",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/style.css" />
    <script>try{var h=document.documentElement,t=localStorage.getItem("globalhr_theme");if(t==="dark")h.classList.add("dark");else h.classList.remove("dark");}catch(e){}</script>
  </head>
  <body class="min-h-screen bg-brandLight text-brandDark dark:bg-slate-950">
    <header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex h-14 items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <a href="../index.html" class="shrink-0" aria-label="Global HR home"><img src="../assets/logo.png" alt="Global HR" class="site-logo site-logo--compact dark:opacity-95" width="180" height="56" decoding="async" /></a>
          <span class="text-sm font-semibold text-brandNavy dark:text-slate-100 truncate">
            Job listings CMS
          </span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span id="adminUserEmail" class="hidden sm:inline text-xs text-slate-500 dark:text-slate-400 truncate max-w-[10rem] lg:max-w-xs"></span><button id="themeToggle" type="button" class="rounded-md border border-slate-300 dark:border-slate-600 px-2.5 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:border-brandBlue hover:text-brandBlue dark:hover:text-sky-400 transition-colors" aria-label="Toggle color theme">
            <span class="inline dark:hidden">Dark</span>
            <span class="hidden dark:inline">Light</span>
          </button>
          <button id="logoutBtn" type="button" class="rounded-md border border-slate-300 dark:border-slate-600 px-3 py-1.5 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:border-red-300 dark:hover:border-red-800 hover:text-red-700 dark:hover:text-red-400 transition-colors">
            Log out
          </button>
        </div>
      </div>
    </header>

    <main id="jobsDashboardRoot" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 text-brandDark dark:text-slate-200">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-brandNavy dark:text-slate-100">
            Jobs
          </h1>
          <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">
            Add, edit, hide, or delete jobs. Changes appear on the public site within a few minutes.
          </p>
        </div>
        <button id="addJobBtn" type="button" class="rounded-md bg-brandBlue px-4 py-2.5 text-sm font-semibold text-white hover:bg-brandNavy transition-colors w-full sm:w-auto">
          Add new job
        </button>
      </div>

      <p id="dashboardError" class="mt-4 hidden rounded-md border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-950/40 px-3 py-2 text-sm text-red-800 dark:text-red-200" role="alert"></p>

      <div class="mt-6 overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-sm">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-slate-50 dark:bg-slate-800/80 text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700">
            <tr>
              <th class="px-4 py-3">Title</th>
              <th class="px-4 py-3">Location</th>
              <th class="px-4 py-3">Type</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="jobTableBody" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
        </table>
        <p id="jobTableEmpty" class="hidden px-4 py-8 text-center text-sm text-slate-600 dark:text-slate-300">
          No jobs yet. Click “Add new job” to create one.
        </p>
      </div>
    </main>

    <!-- Modal -->
    <div id="jobModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 dark:bg-black/70" aria-hidden="true">
      <div class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-xl bg-white dark:bg-slate-900 shadow-xl border border-slate-200 dark:border-slate-700">
        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 px-4 py-3">
          <h2 id="jobModalTitle" class="text-lg font-semibold text-brandNavy dark:text-slate-100"></h2>
          <button id="jobModalClose" type="button" class="rounded-md p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-800 dark:hover:text-slate-100" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <form id="jobForm" class="px-4 py-4 space-y-3">
          <input type="hidden" id="fId" name="id" value="" />
          <div>
            <label for="fTitle" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Title *</label>
            <input id="fTitle" name="title" type="text" required class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" />
          </div>
          <div>
            <label for="fCompany" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Company *</label>
            <input id="fCompany" name="company" type="text" required class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="fLocation" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Location *</label>
              <select id="fLocation" name="location" required class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue">
                <option value="Myanmar">Myanmar</option>
                <option value="Singapore">Singapore</option>
                <option value="Remote">Remote</option>
              </select>
            </div>
            <div>
              <label for="fJobType" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Job type *</label>
              <select id="fJobType" name="job_type" required class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue">
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
              </select>
            </div>
          </div>
          <div>
            <label for="fIndustry" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Industry *</label>
            <input id="fIndustry" name="industry" type="text" required class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" />
          </div>
          <div>
            <label for="fDescription" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Description *</label>
            <textarea id="fDescription" name="description" rows="4" required class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"></textarea>
          </div>
          <div>
            <label for="fApplyEmail" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Apply email</label>
            <input id="fApplyEmail" name="apply_email" type="email" class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" placeholder="careers@example.com" />
            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">Leave blank to send applicants to the contact page from the public site.</p>
          </div>
          <div>
            <label for="fStatus" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Status *</label>
            <select id="fStatus" name="status" required class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue">
              <option value="active">active</option>
              <option value="hidden">hidden</option>
            </select>
          </div>
          <p id="jobFormError" class="hidden text-sm text-red-700 dark:text-red-200 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 rounded-md px-3 py-2"></p>
          <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-2">
            <button id="jobFormCancel" type="button" class="rounded-md border border-slate-300 dark:border-slate-600 px-4 py-2 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
              Cancel
            </button>
            <button type="submit" class="rounded-md bg-brandBlue px-4 py-2 text-sm font-semibold text-white hover:bg-brandNavy transition-colors">
              Save
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/cms-config.js"></script>
    <script src="../js/admin-api.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
