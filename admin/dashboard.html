<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job CMS | Global HR Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Padauk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBlue: "#1a56db",
              brandNavy: "#1e3a8a",
              brandPurple: "#4338ca",
              brandDark: "#0f172a",
              brandLight: "#f8fafc",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="min-h-screen bg-brandLight text-brandDark">
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex h-14 items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <a href="../index.html" class="shrink-0"><img src="../assets/logo.png" alt="Global HR logo" class="h-8 w-auto" loading="lazy" /></a>
          <span class="text-sm font-semibold text-brandNavy truncate">
            <span data-en="Job listings CMS" data-my="အလုပ်စာရင်း စီမံခန့်ခွဲမှု">Job listings CMS</span>
          </span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span id="adminUserEmail" class="hidden sm:inline text-xs text-slate-500 truncate max-w-[10rem] lg:max-w-xs"></span>
          <button id="langToggle" type="button" class="rounded-md border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:border-brandBlue hover:text-brandBlue transition-colors">
            EN / မြန်မာ
          </button>
          <button id="logoutBtn" type="button" class="rounded-md border border-slate-300 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:border-red-300 hover:text-red-700 transition-colors">
            <span data-en="Log out" data-my="ထွက်ရန်">Log out</span>
          </button>
        </div>
      </div>
    </header>

    <main id="jobsDashboardRoot" class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-brandNavy">
            <span data-en="Jobs" data-my="အလုပ်များ">Jobs</span>
          </h1>
          <p class="mt-1 text-sm text-slate-600">
            <span data-en="Add, edit, or hide listings. Hidden jobs do not appear on the public site." data-my="စာရင်းများထည့်ခြင်း၊ ပြင်ခြင်း သို့မဟုတ် ဖျောက်ခြင်း။ ဖျောက်ထားသော အလုပ်များကို လူသိရှင်ကြား ဆိုက်တွင် မပြပါ။">Add, edit, or hide listings. Hidden jobs do not appear on the public site.</span>
          </p>
        </div>
        <button id="addJobBtn" type="button" class="rounded-md bg-brandBlue px-4 py-2.5 text-sm font-semibold text-white hover:bg-brandNavy transition-colors w-full sm:w-auto">
          <span data-en="Add new job" data-my="အလုပ်အသစ်ထည့်ရန်">Add new job</span>
        </button>
      </div>

      <p id="dashboardError" class="mt-4 hidden rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800" role="alert"></p>

      <div class="mt-6 overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-600 border-b border-slate-200">
            <tr>
              <th class="px-4 py-3"><span data-en="Title" data-my="ခေါင်းစဉ်">Title</span></th>
              <th class="px-4 py-3"><span data-en="Location" data-my="တည်နေရာ">Location</span></th>
              <th class="px-4 py-3"><span data-en="Type" data-my="အမျိုးအစား">Type</span></th>
              <th class="px-4 py-3"><span data-en="Status" data-my="အခြေအနေ">Status</span></th>
              <th class="px-4 py-3 text-right"><span data-en="Actions" data-my="လုပ်ဆောင်ချက်များ">Actions</span></th>
            </tr>
          </thead>
          <tbody id="jobTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
        <p id="jobTableEmpty" class="hidden px-4 py-8 text-center text-sm text-slate-600">
          <span data-en="No jobs yet. Click “Add new job” to create one." data-my="အလုပ်မရှိသေးပါ။ “အလုပ်အသစ်ထည့်ရန်” ကိုနှိပ်ပါ။">No jobs yet. Click “Add new job” to create one.</span>
        </p>
      </div>
    </main>

    <!-- Modal -->
    <div id="jobModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60" aria-hidden="true">
      <div class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-xl bg-white shadow-xl border border-slate-200">
        <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3">
          <h2 id="jobModalTitle" class="text-lg font-semibold text-brandNavy"></h2>
          <button id="jobModalClose" type="button" class="rounded-md p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <form id="jobForm" class="px-4 py-4 space-y-3">
          <input type="hidden" id="fId" name="id" value="" />
          <div>
            <label for="fTitle" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Title" data-my="ခေါင်းစဉ်">Title</span> *</label>
            <input id="fTitle" name="title" type="text" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" />
          </div>
          <div>
            <label for="fCompany" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Company" data-my="ကုမ္ပဏီ">Company</span> *</label>
            <input id="fCompany" name="company" type="text" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="fLocation" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Location" data-my="တည်နေရာ">Location</span> *</label>
              <select id="fLocation" name="location" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue">
                <option value="Myanmar">Myanmar</option>
                <option value="Singapore">Singapore</option>
                <option value="Remote">Remote</option>
              </select>
            </div>
            <div>
              <label for="fJobType" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Job type" data-my="အလုပ်အမျိုးအစား">Job type</span> *</label>
              <select id="fJobType" name="job_type" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue">
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
              </select>
            </div>
          </div>
          <div>
            <label for="fIndustry" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Industry" data-my="လုပ်ငန်း">Industry</span> *</label>
            <input id="fIndustry" name="industry" type="text" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" />
          </div>
          <div>
            <label for="fDescription" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Description" data-my="ဖော်ပြချက်">Description</span> *</label>
            <textarea id="fDescription" name="description" rows="4" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"></textarea>
          </div>
          <div>
            <label for="fApplyEmail" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Apply email" data-my="လျှောက်ထားရန် အီးမေးလ်">Apply email</span></label>
            <input id="fApplyEmail" name="apply_email" type="email" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue" placeholder="careers@example.com" />
            <p class="mt-1 text-xs text-slate-500"><span data-en="Leave blank to send applicants to the contact page from the public site." data-my="လူသိရှင်ကြား ဆိုက်တွင် လျှောက်ထားသူများကို ဆက်သွယ်ရန်စာမျက်နှာသို့ ပို့ရန် ဤနေရာကို ဗလာထားပါ။">Leave blank to send applicants to the contact page from the public site.</span></p>
          </div>
          <div>
            <label for="fStatus" class="block text-xs font-semibold text-slate-600 mb-1"><span data-en="Status" data-my="အခြေအနေ">Status</span> *</label>
            <select id="fStatus" name="status" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue">
              <option value="active">active</option>
              <option value="hidden">hidden</option>
            </select>
          </div>
          <p id="jobFormError" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded-md px-3 py-2"></p>
          <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-2">
            <button id="jobFormCancel" type="button" class="rounded-md border border-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors">
              <span data-en="Cancel" data-my="ပယ်ဖျက်ရန်">Cancel</span>
            </button>
            <button type="submit" class="rounded-md bg-brandBlue px-4 py-2 text-sm font-semibold text-white hover:bg-brandNavy transition-colors">
              <span data-en="Save" data-my="သိမ်းရန်">Save</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
