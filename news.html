<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <title>News &amp; Activities | Global HR</title>
    <meta
      name="description"
      content="Latest news and activities from Global HR — arrivals, training, certifications, and employer partnerships across Asia-Pacific."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://script.googleusercontent.com" />
    <link rel="preload" href="js/sheets-news.js?v=20260717b" as="script" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brandBlue: "#1a56db",
              brandNavy: "#1e3a8a",
              brandPurple: "#4338ca",
              brandDark: "#0f172a",
              brandLight: "#f8fafc",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/style.css?v=20260718f" />
    <script>try{var h=document.documentElement,t=localStorage.getItem("globalhr_theme");if(t==="dark")h.classList.add("dark");else h.classList.remove("dark");}catch(e){}</script>
  </head>
  <body class="site-shell bg-brandLight text-brandDark dark:bg-slate-950">
    <header id="siteHeader"></header>
    <script src="js/site-nav.js?v=20260718c"></script>

    <main class="flex flex-col flex-1 text-brandDark dark:text-slate-200">
      <section class="page-hero text-white">
        <img
          class="page-hero__photo"
          src="assets/images/training/cvt-cert-01.jpg"
          alt=""
          width="1600"
          height="900"
          loading="eager"
          decoding="async"
          aria-hidden="true"
        />
        <div class="page-hero__backdrop" aria-hidden="true"></div>
        <div class="page-hero__inner mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
          <a href="index.html" class="brand-hero-logo inline-block mb-4" aria-label="Global HR">
            <img src="assets/logo.png" alt="Global HR" class="site-logo-hero" width="180" height="56" decoding="async" />
          </a>
          <p class="text-sm font-semibold uppercase tracking-wide text-blue-100">Updates</p>
          <h1 id="newsPageTitle" class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight">
            News &amp; activities
          </h1>
          <p id="newsPageSubtitle" class="mt-3 max-w-2xl text-blue-50 leading-relaxed">
            Updates on arrivals, training, certifications, and partnerships from Global HR.
          </p>
        </div>
      </section>

      <section class="page-body-grow py-10 sm:py-12 min-h-[28rem]">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex flex-col flex-1">
          <div id="newsListSection">
            <div id="newsCategoryFilters" class="news-filters" aria-label="Filter by category"></div>

            <div
              id="newsListLoading"
              class="mt-8 grid gap-6 md:grid-cols-2 lg:grid-cols-3"
              aria-busy="true"
              aria-label="Loading news"
            >
              <div class="news-skeleton-card"></div>
              <div class="news-skeleton-card hidden md:block"></div>
              <div class="news-skeleton-card hidden lg:block"></div>
            </div>

            <p
              id="newsListError"
              class="mt-4 hidden rounded-md border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-950/40 px-3 py-2 text-sm text-red-800 dark:text-red-200"
            ></p>

            <div id="newsListGrid" class="mt-8 grid gap-6 md:grid-cols-2 lg:grid-cols-3 hidden"></div>

            <div
              id="newsListEmpty"
              class="mt-10 hidden flex flex-col justify-center rounded-xl border border-dashed border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900/80 px-6 py-16 text-center min-h-[16rem]"
            >
              <p class="text-sm text-slate-600 dark:text-slate-300">No news items match this filter right now.</p>
              <a
                href="news.html"
                class="mt-4 inline-block text-sm font-semibold text-brandBlue hover:text-brandNavy dark:hover:text-sky-300 transition-colors"
              >
                View all news
              </a>
            </div>
          </div>

          <div id="newsDetailView" class="hidden max-w-3xl"></div>
        </div>
      </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="js/site-footer.js?v=20260718"></script>
    <script src="js/cms-config.js?v=20260605"></script>
    <script src="js/sheets-news.js?v=20260717b"></script>
    <script src="js/news-ui.js?v=20260718j"></script>
    <script src="js/news-page.js?v=20260718j"></script>
    <script src="js/main.js?v=20260718"></script>
  </body>
</html>
