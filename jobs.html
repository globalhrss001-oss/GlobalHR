<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <title>Job Listings | Global HR</title>
    <meta name="description" content="Browse current job openings across Asia-Pacific &amp; beyond through Global HR." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="dns-prefetch" href="https://script.googleusercontent.com" />
    <link rel="preload" href="js/sheets-jobs.js?v=20260622" as="script" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brandBlue: "#1a56db",
              brandNavy: "#1e3a8a",
              brandPurple: "#4338ca",
              brandDark: "#0f172a",
              brandLight: "#f8fafc",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/style.css?v=20260703" />
    <script>try{var h=document.documentElement,t=localStorage.getItem("globalhr_theme");if(t==="dark")h.classList.add("dark");else h.classList.remove("dark");}catch(e){}</script>
  </head>
  <body class="site-shell bg-brandLight text-brandDark dark:bg-slate-950">
    <header id="siteHeader"></header>
    <script src="js/site-nav.js?v=20260622"></script>

    <main class="flex flex-col flex-1 text-brandDark dark:text-slate-200">
      <section class="page-hero text-white">
        <img
          class="page-hero__photo"
          src="assets/images/photos/gallery/training-gallery-15-interview-briefing.jpg"
          alt=""
          width="1600"
          height="900"
          loading="eager"
          decoding="async"
          aria-hidden="true"
        />
        <div class="page-hero__backdrop" aria-hidden="true"></div>
        <div class="page-hero__inner mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-12 sm:py-16">
          <a href="index.html" class="brand-hero-logo inline-block mb-4" aria-label="Global HR">
            <img src="assets/logo.png" alt="Global HR" class="site-logo-hero" width="180" height="56" decoding="async" />
          </a>
          <p class="text-sm font-semibold uppercase tracking-wide text-blue-100">
            Careers
          </p>
          <h1 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight">
            Job Listings
          </h1>
          <p class="mt-3 max-w-2xl text-blue-50 leading-relaxed">
            Explore roles with our employer partners across Asia-Pacific &amp; beyond, including China and India.
          </p>
        </div>
      </section>

      <section class="page-body-grow py-10 sm:py-12 min-h-[28rem]">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex flex-col flex-1">
          <p
            id="jobsSampleNotice"
            class="hidden mb-6 rounded-lg border border-amber-200 dark:border-amber-800 bg-amber-50 dark:bg-amber-950/40 px-4 py-3 text-sm text-amber-950 dark:text-amber-100"
            role="status"
          >
            <strong class="font-semibold">Sample listings (beta).</strong>
            These jobs are examples only while we prepare live openings. They are not active vacancies.
          </p>
          <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-4 sm:p-6 shadow-sm">
            <div class="grid gap-4 lg:grid-cols-12 lg:items-end">
              <div class="lg:col-span-5">
                <label for="jobSearchInput" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                  Search
                </label>
                <input
                  id="jobSearchInput"
                  type="search"
                  autocomplete="off"
                  class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"
                  placeholder="Job title, company, keywords"
                />
              </div>
              <div class="lg:col-span-2">
                <label for="filterLocation" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                  Location
                </label>
                <select id="filterLocation" class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"></select>
              </div>
              <div class="lg:col-span-2">
                <label for="filterJobType" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                  Job type
                </label>
                <select id="filterJobType" class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"></select>
              </div>
              <div class="lg:col-span-2">
                <label for="filterIndustry" class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">
                  Industry
                </label>
                <select id="filterIndustry" class="w-full rounded-md border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100 px-3 py-2 text-sm focus:border-brandBlue focus:outline-none focus:ring-1 focus:ring-brandBlue"></select>
              </div>
              <div class="lg:col-span-1 flex lg:justify-end">
                <button id="jobResetFilters" type="button" class="w-full lg:w-auto rounded-md border border-slate-300 dark:border-slate-600 px-3 py-2 text-sm font-semibold text-slate-700 dark:text-slate-200 hover:border-brandBlue hover:text-brandBlue dark:hover:text-sky-400 transition-colors">
                  Reset
                </button>
              </div>
            </div>
            <p id="jobResultsMeta" class="mt-4 text-sm text-slate-600 dark:text-slate-300 hidden"></p>
          </div>

          <p id="jobListError" class="mt-4 hidden rounded-md border border-red-200 dark:border-red-800 bg-red-50 dark:bg-red-950/40 px-3 py-2 text-sm text-red-800 dark:text-red-200"></p>

          <div id="jobListGrid" class="mt-8 grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>

          <div id="jobListEmpty" class="mt-10 hidden flex flex-col justify-center rounded-xl border border-dashed border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900/80 px-6 py-16 text-center min-h-[16rem]">
            <p class="text-sm text-slate-600 dark:text-slate-300">
              No jobs match your filters right now.
            </p>
            <a href="contact.html" class="mt-4 inline-block text-sm font-semibold text-brandBlue hover:text-brandNavy dark:hover:text-sky-300 transition-colors">
              Contact our team
            </a>
          </div>

          <div class="mt-8 flex justify-center">
            <button id="jobLoadMore" type="button" class="hidden rounded-md bg-brandBlue px-5 py-2.5 text-sm font-semibold text-white hover:bg-brandNavy transition-colors">
              Load more
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="js/site-footer.js?v=20260703"></script>
    <script src="js/cms-config.js?v=20260605"></script>
    <script src="js/sheets-jobs.js?v=20260622"></script>
    <script src="js/main.js?v=20260605"></script>
    <script src="js/jobs.js?v=20260605"></script>
  </body>
</html>
